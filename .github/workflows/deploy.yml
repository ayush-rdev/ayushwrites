# Deploys the built site to GitHub Pages on every push to `main`.
#
# One manual step required once:
#   repository Settings → Pages → Source: "GitHub Actions"
#
# Scheduled rebuild (twice a day, UTC): posts with a future pubDate are
# hidden at build time, so this re-deploys each day to publish them
# automatically on their date. A rebuild with no source change simply
# re-deploys the same content — harmless, ~1 min of Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # allows running the workflow manually from the Actions tab
  workflow_dispatch:
  # scheduled publishing — lets future-dated posts go live on their date
  schedule:
    - cron: '0 4,16 * * *'

# allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # Pull pageview stats from GoatCounter and write them into public/ so
      # the built site serves stats.json (read by the /admin analytics view).
      # Guarded: no secrets configured = no stats.json = admin shows the
      # "connect analytics" state instead of failing.
      - name: Refresh analytics snapshot
        if: env.GOATCOUNTER_SITE != '' && env.GOATCOUNTER_API_KEY != ''
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          node -e '
            const site = process.env.GOATCOUNTER_SITE;
            const key = process.env.GOATCOUNTER_API_KEY;
            const api = `https://${site}.goatcounter.com/api/v0`;
            const headers = { Authorization: `Bearer ${key}`, "Content-Type": "application/json" };
            const days = 60;
            const start = new Date(Date.now() - days * 864e5).toISOString().slice(0, 13) + ":00:00Z";
            const end = new Date().toISOString().slice(0, 13) + ":00:00Z";
            const q = `start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
            const [totalRes, hitsRes] = await Promise.all([
              fetch(`${api}/stats/total?${q}`, { headers }),
              fetch(`${api}/stats/hits?${q}&limit=100`, { headers }),
            ]);
            if (!totalRes.ok || !hitsRes.ok) throw new Error(`stats fetch failed: ${totalRes.status} ${hitsRes.status}`);
            const total = await totalRes.json();
            const hits = await hitsRes.json();
            const out = {
              generated_at: new Date().toISOString(),
              total: total.total || 0,
              days: (total.stats || []).map((d) => ({ day: d.day, daily: d.daily || 0 })),
              hits: (hits.hits || [])
                .filter((h) => !h.event)
                .map((h) => ({ path: h.path, count: h.count, title: h.title || "" })),
            };
            const fs = require("fs");
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/stats.json", JSON.stringify(out));
          '
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
